name: 02 - Explorador de Produtos Multimix Centro

on:
  schedule:
    # Roda todos os dias à meia-noite (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente quando quiser

jobs:
  explorar:
    runs-on: ubuntu-latest
    
    # 🔑 Permissão de escrita para salvar os links no seu repositório
    permissions:
      contents: write

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Executar Explorador de Produtos (Etapa 02)
      run: |
        python 02_explorador_multimix_centro.py

    - name: Salvar e subir novos links para o GitHub
      run: |
        # Configura as credenciais do Git usando a conta do robô do GitHub
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona o arquivo 02_links_multimix_centro.txt que foi gerado/atualizado
        git add 02_links_multimix_centro.txt
        
        # Verifica se realmente há mudanças antes de commitar
        if git diff --staged --quiet; then
          echo "Nenhuma mudança detectada em 02_links_multimix_centro.txt. Pulando commit."
        else
          git commit -m "🤖 [Etapa 02] 02_links_multimix_centro.txt atualizado automaticamente"
          
          # Puxa alterações recentes para evitar conflito antes de enviar
          git pull --rebase origin main
          
          git push origin main
        fi
