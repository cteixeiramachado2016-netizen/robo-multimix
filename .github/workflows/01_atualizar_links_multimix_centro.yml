name: 01 - Atualizar Links Multimix Centro

on:
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub
  schedule:
    - cron: '0 3 * * *' # Roda automaticamente todos os dias às 00:00 (Horário de Brasília / 03:00 UTC)

jobs:
  rodar-testes:
    runs-on: ubuntu-latest
    
    # Dá permissão para o GitHub Actions escrever/atualizar arquivos no repositório
    permissions:
      contents: write

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências do Robô
        run: |
          pip install --upgrade pip
          pip install playwright supabase python-dotenv pytz
          playwright install chromium

      - name: Criar Arquivo de Credenciais Temporário
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> credenciais_supabase.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> credenciais_supabase.env

      - name: Executar Script Explorador de Links
        run: python 01_explorador_multimix_centro.py

      - name: Salvar links atualizados no Repositório
        run: |
          git config --global user.name "Robo Explorador"
          git config --global user.email "robo@github.com"
          git add links_01_multimix_centro.txt
          git diff --quiet && git diff --staged || git commit -m "🤖 [Etapa 01] Atualização automática diária dos links do Multimix Centro"
          git push
