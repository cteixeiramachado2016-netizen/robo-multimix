name: 02 - Explorador de Produtos Multimix Centro

on:
  schedule:
    # Roda todo dia à 01:00 da manhã no Horário de Brasília (04:00 UTC), logo após a Etapa 01
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite acionamento manual

jobs:
  extrair-produtos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Robô
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv pytz
          playwright install chromium

      - name: Executar Script Extrator de Produtos
        run: python 02_explorador_multimix_centro.py

      - name: Salvar links de produtos no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_links_multimix_centro.txt
          if git diff --staged --quiet; then
            echo "Nenhuma mudança detectada em 02_links_multimix_centro.txt. Pulando commit."
          else
            git commit -m "🤖 [Etapa 02] Atualização de 02_links_multimix_centro.txt"
            git pull --rebase origin main
            git push origin main
          fi
