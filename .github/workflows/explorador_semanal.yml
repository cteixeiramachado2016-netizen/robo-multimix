- name: Salvar e subir novos links para o GitHub
      run: |
        # Configura as credenciais do Git usando a conta do robô do GitHub
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona o arquivo links_multimix.txt que foi gerado/atualizado
        git add links_multimix.txt
        
        # Verifica se realmente há mudanças antes de commitar para não dar erro
        if git diff --staged --quiet; then
          echo "Nenhuma mudança detectada em links_multimix.txt. Pulando commit."
        else
          git commit -m "bot: 🚀 links_multimix.txt atualizado automaticamente pelo explorador"
          
          # 🔑 O SEGREDO ESTÁ AQUI: Puxa as alterações recentes do repositório antes de enviar as dele
          git pull --rebase origin main
          
          git push origin main
        fi
