name: Executar meu_robo.py - Multimix Centro

on:
  schedule:
    # 🕒 Configurado para disparar todo dia às 04:00 da manhã (Horário de Brasília / 07:00 UTC)
    - cron: '0 7 * * *'
  # Permite clicar no botão para rodar manualmente sempre que quiser
  workflow_dispatch:

# Garante que o robô tenha permissão para commitar as alterações de volta no repositório
permissions:
  contents: write

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    # Define as variáveis de ambiente para todo o Job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # 🔥 Garantia de inserção em lotes

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl requests beautifulsoup4 python-dotenv supabase pytz

      - name: 4. Instalar Navegadores e Dependências do Sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 🧹 NOVO PASSO: Limpa a tabela de produção antes da carga diária do robô
      - name: 5. Limpar tabela historico_precos no Supabase
        run: |
          python -c "
          import os
          from supabase import create_client
          # Se tiver a SERVICE_KEY, usa ela para garantir permissão total na remoção
          key = os.getenv('SUPABASE_SERVICE_KEY') or os.getenv('SUPABASE_KEY')
          url = os.getenv('SUPABASE_URL')
          
          if not url or not key:
              print('❌ Erro: Credenciais do Supabase não encontradas no ambiente!')
              exit(1)
              
          supabase = create_client(url, key)
          try:
              # Remove todos os dados da tabela historico_precos para receber a nova raspagem do zero
              supabase.table('historico_precos').delete().neq('produto', '').execute()
              print('🧹 Tabela historico_precos limpa com sucesso do GitHub Actions!')
          except Exception as e:
              print(f'❌ Erro ao limpar a tabela historico_precos: {e}')
              exit(1) # Falhar o job aqui impede que novos dados entrem misturados com sujeira antiga
          "

      - name: 6. Executar Robô de Preços (meu_robo.py)
        run: python meu_robo.py

      - name: 7. Salvar dados atualizados no GitHub (Caso o arquivo de links mude)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add links_multimix.txt || true
          
          # Verifica se há alterações reais antes de tentar commitar
          if ! git diff --cached --quiet; then
            git commit -m "Automação: Atualização diária de preços via meu_robo.py"
            git push
          else
            echo "Nenhuma mudança detectada nos arquivos de links hoje."
          fi
