name: Pipeline de Preços - Multimix Centro

on:
  workflow_dispatch:
    # Mantém o botão manual ativo no painel do GitHub Actions

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na nuvem
      - name: Configurar Python
        uses: actions/with-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Otimiza o tempo de inicialização

      # 3. Instala as dependências necessárias para o projeto
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv
          # Se você usar mais alguma biblioteca, pode adicionar a linha do pip install aqui

      # 4. Instala os navegadores do Playwright (Chromium)
      - name: Instalar Navegadores do Playwright
        run: playwright install chromium

      # 5. Executa o robô passando as credenciais escondidas (Secrets) do GitHub
      - name: Executar o Robô de Preços
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python meu_robo.py
