name: Pipeline de Preços - Multimix Centro

on:
  # Programado para rodar todos os dias às 03:00 da manhã (Horário de Brasília / 06:00 UTC)
  schedule:
    - cron: '0 6 * * *'
  # Permite clicar no botão para rodar manualmente sempre que quiser
  workflow_dispatch:

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl requests beautifulsoup4 python-dotenv supabase

      - name: 4. Instalar Navegadores do Playwright
        run: playwright install chromium

      - name: 5. Executar Explorador de Links
        run: python explorador_multimix_centro.py

      - name: 6. Executar Robô de Preços
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python meu_robo.py

      - name: 7. Salvar dados atualizados no GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add precos_mercado.xlsx historico_precos.txt produtos_multimix_centro.txt || true
          git commit -m "Automação: Atualização diária de preços [Nova Build]" || echo "Nenhuma mudança hoje."
          git push || true
