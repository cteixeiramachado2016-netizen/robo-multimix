name: Pipeline de Preços - Multimix Centro

on:
  schedule:
    # Programado para rodar todos os dias às 03:00 da manhã (Horário de Brasília / 06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Adiciona o botão para você rodar manualmente quando quiser

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar navegadores e dependências
        run: |
          pip install playwright pandas openpyxl
          playwright install chromium

      - name: 4. Executar Explorador de Links
        run: python explorador_multimix_centro.py

      - name: 5. Executar Robô de Preços
        run: python meu_robo.py

      - name: 6. Salvar dados atualizados no GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add precos_mercado.xlsx historico_precos.txt produtos_multimix_centro.txt
          git commit -m "Automação: Atualização diária de preços [Nova Build]" || echo "Nenhuma mudança hoje."
          git push
