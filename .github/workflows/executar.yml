name: Pipeline de Preços - Multimix Centro

on:
  schedule:
    # 🕒 Configurado para rodar todo dia às 04:00 da manhã (Horário de Brasília / 07:00 UTC)
    # Roda exatamente 1 hora após o Supabase limpar o banco de dados (que limpa às 03:00)
    - cron: '0 7 * * *'
  # Permite clicar no botão para rodar manualmente sempre que quiser
  workflow_dispatch:

# Garante que o robô tenha permissão para commitar as alterações de volta no repositório
permissions:
  contents: write

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    # Define as variáveis de ambiente para todo o Job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # 🔥 Adicionado para garantir a inserção em lotes

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl requests beautifulsoup4 python-dotenv supabase

      - name: 4. Instalar Navegadores e Dependências do Sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      # DESATIVADO: O explorador foi comentado com '#' para não rodar todo dia e não travar o processo
      # - name: 5. Executar Explorador de Links
      #   run: python explorador_multimix_centro.py

      - name: 6. Executar Robô de Preços
        run: python meu_robo.py

      - name: 7. Salvar dados atualizados no GitHub (Caso o txt de links mude)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add produtos_multimix_centro.txt links_multimix.txt || true
          
          # Verifica se há alterações reais antes de tentar commitar
          if ! git diff --cached --quiet; then
            git commit -m "Automação: Atualização diária de preços [Nova Build]"
            git push
          else
            echo "Nenhuma mudança detectada nos arquivos de links hoje."
          fi
