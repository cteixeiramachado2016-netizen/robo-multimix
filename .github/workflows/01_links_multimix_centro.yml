name: 01 - Links Multimix Centro

on:
  schedule:
    # Roda todo dia à meia-noite (00:00) no Horário de Brasília (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite acionamento manual

jobs:
  rodar-explorador:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências do Robô
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv pytz
          playwright install chromium

      - name: Executar Script Explorador de Links (Etapa 01)
        run: python 01_explorador_multimix_centro.py

      - name: Salvar links atualizados no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_links_multimix_centro.txt
          if git diff --staged --quiet; then
            echo "Nenhuma mudança detectada em 01_links_multimix_centro.txt. Pulando commit."
          else
            git commit -m "🤖 [Etapa 01] Atualização automática de 01_links_multimix_centro.txt"
            git pull --rebase origin main
            git push origin main
          fi
