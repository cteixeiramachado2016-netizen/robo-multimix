name: 03 - meu_robo.py - Multimix Centro

on:
  schedule:
    # Configurado para disparar todo dia às 04:00 da manhã (Horário de Brasília) / 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite acionar manualmente a qualquer momento

jobs:
  extrair-precos:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências do Robô
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv supabase pytz requests
          playwright install chromium

      - name: Executar Robô Extrator de Preços (meu_robo.py)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python meu_robo.py

      - name: Salvar logs ou atualizações no Repositório (se houver)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nenhuma mudança detectada nos arquivos locais. Pulando commit."
          else
            git commit -m "🤖 [Etapa 03] Execução de meu_robo.py finalizada"
            git pull --rebase origin main
            git push origin main
          fi
