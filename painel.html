<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Help - Painel do Assinante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold text-success">🏆 Club Help</h1>
            <p class="lead">Monte sua Lista & Compare Preços em Petrópolis</p>
        </div>

        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3">🔍 Adicionar Produtos</h3>
                    <div class="mb-3">
                        <label for="busca" class="form-label">Digite o nome do produto:</label>
                        <input type="text" id="busca" class="form-control" placeholder="Ex: Arroz, Leite...">
                    </div>
                    
                    <div id="resultados-busca" class="list-group style-res" style="max-height: 300px; overflow-y: auto;">
                        </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3">📋 Itens na sua Lista</h3>
                    
                    <div id="carrinho-vazio" class="alert alert-info">
                        Sua lista está vazia. Busque produtos ao lado para começar!
                    </div>

                    <ul id="lista-itens" class="list-group mb-3">
                        </ul>

                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <h4 class="h5">Valor Total Estimado:</h4>
                        <span id="total-carrinho" class="fs-4 fw-bold text-success">R$ 0,00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = "https://sua-url-do-supabase.supabase.co";
        const SUPABASE_KEY = "sua-chave-anon-public";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Referências dos elementos da tela
        const inputBusca = document.getElementById('busca');
        const divResultados = document.getElementById('resultados-busca');
        const ulLista = document.getElementById('lista-itens');
        const divVazio = document.getElementById('carrinho-vazio');
        const txtTotal = document.getElementById('total-carrinho');

        // Estado da aplicação (Simulando uma lista local para o MVP acelerado)
        let carrinho = [];

        // 2. EVENTO DE BUSCA (Dispara a cada tecla digitada)
        inputBusca.addEventListener('input', async (e) => {
            const termo = e.target.value;
            if (termo.length < 2) {
                divResultados.innerHTML = '';
                return;
            }

            // Busca na tabela historico_precos filtrando com ilike
            const { data, error } = await _supabase
                .from('historico_precos')
                .select('id, produto, preco, mercado')
                .ilike('produto', `%${termo}%`);

            if (error) {
                console.error("Erro na busca:", error);
                return;
            }

            // Limpa e renderiza os resultados encontrados
            divResultados.innerHTML = '';
            
            // Remove duplicados pelo nome do produto para exibição limpa
            const produtosUnicos = Array.from(new Set(data.map(p => p.produto)))
                .map(nome => data.find(p => p.produto === nome));

            produtosUnicos.forEach(prod => {
                const btn = document.createElement('button');
                btn.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
                btn.innerHTML = `
                    <div>
                        <strong>${prod.produto}</strong><br>
                        <small class="text-muted">${prod.mercado}</small>
                    </div>
                    <span class="badge bg-success p-2">R$ ${prod.preco.toFixed(2)} ➕</span>
                `;
                btn.onclick = () => adicionarAoCarrinho(prod);
                divResultados.appendChild(btn);
            });
        });

        // 3. ADICIONAR ITEM AO CARRINHO
        function adicionarAoCarrinho(produto) {
            const itemExistente = carrinho.find(item => item.id === produto.id);
            if (itemExistente) {
                itemExistente.quantidade += 1;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }
            atualizarInterfaceCarrinho();
        }

        // 4. REMOVER ITEM DO CARRINHO
        window.removerDoCarrinho = function(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarInterfaceCarrinho();
        }

        // 5. ATUALIZAR A TELA DO CARRINHO E CALCULAR SOMA
        function atualizarInterfaceCarrinho() {
            ulLista.innerHTML = '';
            let totalGeral = 0;

            if (carrinho.length === 0) {
                divVazio.style.display = 'block';
                txtTotal.innerText = 'R$ 0,00';
                return;
            }

            divVazio.style.display = 'none';

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                totalGeral += subtotal;

                const li = document.createElement('li');
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
                    <div>
                        <h6 class="my-0">${item.produto}</h6>
                        <small class="text-muted">${item.mercado} | Qtd: ${item.quantidade}</small>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-muted">R$ ${subtotal.toFixed(2)}</span>
                        <button class="btn btn-sm btn-outline-danger" onclick="removerDoCarrinho(${item.id})">🗑️</button>
                    </div>
                `;
                ulLista.appendChild(li);
            });

            txtTotal.innerText = `R$ ${totalGeral.toFixed(2)}`;
        }
    </script>
</body>
</html>
